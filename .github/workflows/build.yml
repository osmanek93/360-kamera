name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Zip ac
        run: unzip -q Camera360.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK ve NDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDK" "$SDK/cmdline-tools" || true
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "cmake;3.22.1" "ndk;25.1.8937393" "platforms;android-34" "build-tools;34.0.0"
      - name: Derle
        working-directory: Camera360
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Camera360-apk
          path: Camera360/app/build/outputs/apk/release/*.apk

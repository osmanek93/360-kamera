name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Zip ac
        run: unzip -q Camera360.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: CMake ve NDK
        run: sdkmanager "cmake;3.22.1" "ndk;25.2.9519653" "platforms;android-34" "build-tools;34.0.0"
      - name: Derle
        working-directory: Camera360
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Camera360-apk
          path: Camera360/app/build/outputs/apk/release/*.apk
